<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drishti — Conversational Crime Intelligence</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <div class="brand-text">
        <strong>Drishti</strong>
        <span class="sub">ದೃಷ್ಟಿ · Crime Intelligence</span>
      </div>
    </div>
    <div class="controls">
      <div class="seg" id="lang" role="tablist" aria-label="Language">
        <button class="seg-btn active" data-lang="en">EN</button>
        <button class="seg-btn" data-lang="kn">ಕನ್ನಡ</button>
      </div>
      <select id="role" class="role" aria-label="Role">
        <option value="Investigator">Investigator</option>
        <option value="Analyst">Analyst</option>
        <option value="Supervisor">Supervisor</option>
        <option value="Policymaker">Policymaker</option>
      </select>
      <span class="audit" title="Every query is audit-logged">● audit on</span>
    </div>
  </header>

  <main class="layout">
    <!-- Chat -->
    <section class="chat card" aria-label="Conversation">
      <div class="chat-log" id="log"></div>
      <div class="suggest" id="suggest"></div>
      <form class="composer" id="composer">
        <button type="button" class="icon-btn" id="mic" title="Voice input" aria-label="Voice input">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <input id="input" type="text" autocomplete="off" placeholder="Ask about FIRs, networks, hotspots, offenders…" />
        <button type="submit" class="send" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
      <button class="export" id="export" title="Save conversation as PDF">⭳ Export conversation (PDF)</button>
    </section>

    <!-- Insight panel -->
    <section class="insight card" aria-label="Insights">
      <div class="insight-head">
        <span class="pill" id="intentPill">Insight</span>
        <span class="conf" id="confBadge"></span>
      </div>
      <div class="insight-body" id="viz">
        <div class="empty">
          <div class="eye">◎</div>
          <p>Ask a question to see networks, trends, hotspots and risk — each answer grounded in evidence.</p>
        </div>
      </div>
      <div class="evidence" id="evidence" hidden>
        <h4>Evidence &amp; reasoning</h4>
        <div class="chips" id="evChips"></div>
        <ul class="reasoning" id="reasoning"></ul>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>KSPH26 · Datathon 2026 · <strong>synthetic data only</strong></span>
    <span id="apiState" class="api-state">connecting…</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
